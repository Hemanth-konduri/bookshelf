<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReadLog</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-book-open"></i></div>
        <div>
          <h1>ReadLog</h1>
          <p class="tagline">Your personal reading journey</p>
        </div>
      </div>
      <button class="add-btn" id="open-modal">
        <i class="fa-solid fa-plus"></i> Add Book
      </button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon" style="background:#fff2e8;color:#e07b39"><i class="fa-solid fa-books"></i></div>
        <div class="stat-info">
          <span id="total-count">0</span>
          <label>Total Books</label>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#e8f4ff;color:#3b82f6"><i class="fa-solid fa-book-open-reader"></i></div>
        <div class="stat-info">
          <span id="reading-count">0</span>
          <label>Reading Now</label>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#e8fff2;color:#22c55e"><i class="fa-solid fa-circle-check"></i></div>
        <div class="stat-info">
          <span id="finished-count">0</span>
          <label>Finished</label>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#f3e8ff;color:#a855f7"><i class="fa-solid fa-bookmark"></i></div>
        <div class="stat-info">
          <span id="want-count">0</span>
          <label>Want to Read</label>
        </div>
      </div>
    </div>
  </header>

  <!-- Filter Toolbar -->
  <div class="filter-toolbar">
    <span class="books-count" id="books-count">0 Books</span>
    <div class="filter-dropdowns">
      <div class="filter-dropdown-wrap">
        <i class="fa-solid fa-circle-half-stroke"></i>
        <select id="status-filter">
          <option value="All">All Status</option>
          <option value="Want to Read">Want to Read</option>
          <option value="Reading">Reading</option>
          <option value="Finished">Finished</option>
        </select>
      </div>
      <div class="filter-dropdown-wrap">
        <i class="fa-solid fa-tag"></i>
        <select id="genre-filter">
          <option value="All">All Genres</option>
          <option value="Self-Help">Self-Help</option>
          <option value="Fiction">Fiction</option>
          <option value="Technology">Technology</option>
          <option value="Business">Business</option>
          <option value="Psychology">Psychology</option>
          <option value="Philosophy">Philosophy</option>
          <option value="Biography">Biography</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Books Grid -->
  <main class="books-section">
    <div id="books-grid" class="books-grid"></div>
    <div id="empty-state" class="empty-state hidden">
      <i class="fa-solid fa-book-open"></i>
      <h3>No books here yet</h3>
      <p>Click "Add Book" to start your reading log</p>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2><i class="fa-solid fa-plus"></i> Add New Book</h2>
        <button class="modal-close" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="book-form">
        <div class="form-row">
          <div class="form-group">
            <label>Book Title *</label>
            <input type="text" id="title" placeholder="e.g. Atomic Habits" required />
          </div>
          <div class="form-group">
            <label>Author *</label>
            <input type="text" id="author" placeholder="e.g. James Clear" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="Want to Read">Want to Read</option>
              <option value="Reading">Reading</option>
              <option value="Finished">Finished</option>
            </select>
          </div>
          <div class="form-group">
            <label>Genre</label>
            <select id="genre">
              <option value="Self-Help">Self-Help</option>
              <option value="Fiction">Fiction</option>
              <option value="Technology">Technology</option>
              <option value="Business">Business</option>
              <option value="Psychology">Psychology</option>
              <option value="Philosophy">Philosophy</option>
              <option value="Biography">Biography</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Cover Image URL</label>
            <input type="url" id="imageUrl" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea id="notes" placeholder="Why do you want to read this? Any thoughts..." rows="3"></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancel-modal">Cancel</button>
          <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> Add Book</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
